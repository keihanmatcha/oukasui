name: Update Nagao Data All-in-One

on:
  schedule:
    - cron: '0 0 * * *' # 毎日 9:00 (JST)
  workflow_dispatch: # 手動実行ボタン

jobs:
  update_process:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.OUKASUI_TOKEN }}
          fetch-depth: 0 # 全履歴を取得してpullを安定させる

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install google-api-python-client requests

      - name: 1. Run Archive Script
        run: python update_archives.py
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.OUKASUI_TOKEN }}

      - name: 2. Run Songs Script
        # update_archives.py で新しくなった archive_videos.json を元に処理
        run: python update_songs.py

      - name: 3. Commit and Push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # 手元で更新されたファイルをステージング
          git add archives/archive_videos.json songs/draft_songs.json
          
          # 変更がある場合のみコミット
          if ! git diff --cached --quiet; then
            git commit -m "Update archive and songs drafts"
            
            # 重要：update_archives.py がAPIで更新した分を取り込んでから送る
            git pull --rebase origin main
            git push origin main
          else
            echo "No changes detected."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.OUKASUI_TOKEN }}
