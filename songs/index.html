<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>桜華水｜曲検索</title>
  <link rel="icon" href="../images/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="../images/Nagao-icon.png" sizes="512x512">
  <link rel="apple-touch-icon" href="../images/Nagao-icon.png">
  
  <style>
    /* ===== 基本スタイル ===== */
    :root{ --fg:#222; --muted:#4b5563; --accent:#625DA1; --bg:#fff; --border:#e5e7eb; --panel:#f8f8ff; }
    html,body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,sans-serif}
    header{position:sticky;top:0;background:rgba(255,255,255,0.9);backdrop-filter:blur(6px);border-bottom:1px solid var(--border); z-index: 100;}
    .wrap{max-width:1200px;margin-inline:auto;padding:14px 16px}
    h1{margin:0 0 8px;font-size:20px}
    .toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
    .searchbar{display:flex;gap:10px;align-items:center;flex:1}
    .searchbar input{flex:1;padding:10px 12px;border:1px solid var(--border);border-radius:10px;font-size:16px}
    
    /* タグフィルタ */
    .filterbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
    .label{font-size:12px;color:var(--muted)}
    .filter-tags{display:flex;gap:8px;flex-wrap:wrap}
    .chip-tag{font-size:12px;padding:6px 12px;border:1px solid #e5dfff;border-radius:999px;background:#f0ecff;color:#5b55a5;cursor:pointer}
    .chip-tag.active{background:var(--accent);border-color:var(--accent);color:#fff}
    .chip-clear{font-size:12px;padding:6px 10px;border:1px dashed var(--border);border-radius:999px;background:#fff;color:#6b7280;cursor:pointer}

    /* レイアウト（PC基準） */
    .grid{display:grid;gap:16px;align-items:start;grid-template-columns:1.2fr .8fr;grid-template-areas:"list player"}
    .grid.player-left{grid-template-columns:.8fr 1.2fr;grid-template-areas:"player list"}

    /* リストスタイル */
    .list{border:1px solid var(--border);border-radius:14px;overflow:hidden}
    .row {
      display: grid; grid-template-columns: minmax(260px,1.5fr) auto 120px minmax(0,2fr);
      align-items: center; gap: 12px; padding: 10px 14px;
      border-top: 1px solid var(--border); background: #fafafa;
    }
    .row:nth-child(odd){background:#f6f6fb}
    .row:first-child{border-top:none}
    
    .songcell{display:flex;flex-direction:column}
    .song-meta{display:flex;align-items:center;gap:8px}
    .songtitle .link{font-weight:600; font-size:15px; cursor:pointer; background:none; border:none; padding:0; text-align:left;}
    .artist .link{font-size:12px; color:var(--muted); cursor:pointer; background:none; border:none; padding:0;}
    .favorite-btn{all:unset;cursor:pointer;color:#ccc;font-size:20px;}
    .favorite-btn.is-favorited{color:#ffd700;text-shadow:0 0 5px rgba(255,215,0,0.5);}
    
    .date{text-align:right; font-size:13px; color:#555;}
    .videotitle button{all:unset;cursor:pointer;font-size:14px;color:#111;}
    .videotitle button:hover{color:var(--accent);text-decoration:underline}
    .tags-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;}
    .tag-badge{font-size:10px;padding:2px 8px;border-radius:10px;background:#f2efff;color:#4c46a6;border:1px solid #e5dfff;}

    .nothing{padding:20px;text-align:center;color:var(--muted);display:none}

    /* プレイヤーパネル (PC) */
    .player-col { grid-area: player; }
    .list-col { grid-area: list; }

    .player-panel{
      border:1px solid var(--border);border-radius:14px;overflow:hidden;background:var(--panel);
      /* PCではsticky */
      position:sticky; top:84px; 
    }
    .player-head{
      display:flex;justify-content:space-between;align-items:center;padding:10px 14px;
      background:#f0f1ff;border-bottom:1px solid var(--border);
    }
    .player-title{font-size:14px;font-weight:bold;white-space:nowrap;overflow:hidden;text-overflow:ellipsis; max-width: 200px;}
    .player-body{position:relative;aspect-ratio:16/9;width:100%;background:#000}
    .player-body iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
    .player-foot{padding:10px;border-top:1px solid var(--border);background:#fff}
    .setlist{max-height:300px;overflow-y:auto;border:1px solid #eee;border-radius:8px;margin-top:8px}
    .set-item{padding:8px;border-bottom:1px solid #eee;cursor:pointer;font-size:13px}
    .set-item:hover{background:#f9f9f9}
    .set-item.active{background:#eef2ff;color:var(--accent);font-weight:bold}
    
    /* 閉じるボタン（PCでは非表示、スマホモーダルで表示） */
    #closePlayerBtn { display: none; font-size: 24px; cursor: pointer; line-height: 1; padding: 0 8px; }

    /* =========================================
       ★★★ モバイル・スマホ対応 (900px以下) ★★★ 
       ========================================= */
    @media (max-width: 900px) {
        /* グリッド解除 */
        #grid { display: block; }
        
        /* リストの表示調整 */
        .row{ grid-template-columns:1fr; align-items:start; gap: 8px; }
        .date{ justify-self:start; font-size: 11px; color: #888; margin-bottom: 2px; }
        .songtitle .link { font-size: 16px; }
        
        /* 動画タイトル簡略化 */
        .videotitle button {
           font-size: 11px; color: #6b7280; line-height: 1.4;
           display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
        }

        /* プレイヤー初期状態（非表示にしておく、または下部に隠すなど） */
        .player-col { display: none; } 
        
        /* ★★★ モーダル再生画面（動画検索仕様） ★★★ 
           bodyに .player-active がついた時のスタイル
        */
        body.player-active { overflow: hidden; /* 背景スクロール禁止 */ }
        
        body.player-active header,
        body.player-active .list-col { display: none !important; } /* ヘッダーとリストを消す */
        
        body.player-active .player-col {
            display: flex !important; /* 表示させる */
            position: fixed; top: 0; left: 0; z-index: 9999;
            width: 100%; height: 100vh;
            background: rgba(0, 0, 0, 0.85); /* 背景暗く */
            align-items: center; justify-content: center;
        }

        body.player-active .player-panel {
            position: relative; top: auto;
            width: 95%; max-width: 600px; max-height: 90vh;
            background: #fff; border-radius: 12px;
            display: flex; flex-direction: column;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }
        
        /* モーダル内の閉じるボタンを表示 */
        #closePlayerBtn { display: block; }
        
        /* モーダル内の要素調整 */
        .player-head { padding: 12px; }
        .player-foot { overflow-y: auto; flex: 1; } /* セットリストをスクロール可能に */
    }
    /* スマホ・タブレット（900px以下）向けのスタイルまとめ */
@media (max-width: 900px){
  /* === リストのレイアウト === */
  /* グリッドを1列にして縦積みにする */
  .row {
    grid-template-columns: 1fr;
    align-items: start;
    gap: 8px; /* 要素の間隔 */
  }

  /* 日付を左寄せにする */
  .date {
    justify-self: start;
    font-size: 11px;
    color: #888;
    margin-bottom: 2px;
  }

  /* 動画タイトルの位置調整 */
  .videotitle {
    margin-top: -4px;
  }
}

/* === 検索結果ゼロの表示（画面サイズ関係なく共通） === */
.nothing {
  color: var(--muted);
  text-align: center;
  padding: 20px;
  border: 1px dashed var(--border);
  border-radius: 12px;
}

  </style>
</head>
<body>
  <header>
    <div class="wrap" style="display:flex;align-items:center;justify-content:space-between;">
      <a href="../index.html" style="font-weight:700;color:var(--accent);text-decoration:none">HOME</a>
      <h1>🎵 曲検索</h1>
    </div>
    <div class="wrap" style="padding-top:0">
      <div class="toolbar">
        <div class="searchbar"><input id="q" type="search" placeholder="曲名 / アーティスト / タグ..." autocomplete="off" /></div>
        <div class="filterbar">
          <button id="filterFavorites" class="chip-tag" type="button">★ お気に入り</button>
          <div id="filterTags" class="filter-tags"></div>
          <button id="clearTags" class="chip-clear" type="button" style="display:none">クリア</button>
        </div>
      </div>
    </div>
  </header>

  <main class="wrap">
    <div id="grid" class="grid player-left">
      
      <section class="list-col">
        <div id="list" class="list"></div>
        <div id="empty" class="nothing">該当なし</div>
      </section>

      <aside class="player-col">
        <div class="player-panel" id="playerPanel">
          <div class="player-head">
            <div style="overflow:hidden;">
              <div class="player-title" id="playerTitle">Select a video</div>
              <div style="font-size:11px;color:#666;" id="playerMeta">-</div>
            </div>
            <div id="closePlayerBtn">✕</div>
          </div>
          
          <div class="player-body">
            <iframe id="ytFrame" src="about:blank" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
          </div>
          
          <div class="player-foot">
            <div style="font-weight:bold;margin-bottom:6px;font-size:13px;">セットリスト</div>
            <div class="setlist" id="setlist"></div>
            <div style="margin-top:10px;font-size:11px;text-align:right;">
               <a id="openYT" href="#" target="_blank" style="color:var(--accent)">YouTubeで開く ↗</a>
            </div>
          </div>
        </div>
      </aside>

    </div>
  </main>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    /* ========== データ処理・表示ロジック ========== */
    const $list = document.getElementById('list');
    const $empty = document.getElementById('empty');
    const $q = document.getElementById('q');
    const $filterTags = document.getElementById('filterTags');
    const $clearTags = document.getElementById('clearTags');
    const $filterFavorites = document.getElementById('filterFavorites');
    
    // プレイヤー関連
    const $playerPanel = document.getElementById('playerPanel');
    const $yt = document.getElementById('ytFrame');
    const $pTitle = document.getElementById('playerTitle');
    const $pMeta = document.getElementById('playerMeta');
    const $setlist = document.getElementById('setlist');
    const $openYT = document.getElementById('openYT');
    const $closeBtn = document.getElementById('closePlayerBtn');

    let ALL_ROWS=[], VIDEO_MAP=new Map(), ALL_TAGS=[], SELECTED_TAGS=new Set();
    let filterByFavorites = false;
    const FAVORITES_KEY = 'favorites_songs';

    // ユーティリティ
    const pad = n => String(n).padStart(2,'0');
    const ymdToDots = ymd => { const [y,m,d]=(ymd||'').split('-'); return y?`${y}.${pad(m)}.${pad(d)}`:''; };
    const toSeconds = v => {
      if(!v) return 0;
      if(typeof v==='number') return v;
      const p = String(v).split(':').map(Number);
      if(p.length===3) return p[0]*3600+p[1]*60+p[2];
      if(p.length===2) return p[0]*60+p[1];
      return 0;
    };
    const hms = sec => {
      sec = parseInt(sec,10);
      const h=Math.floor(sec/3600), m=Math.floor(sec%3600/60), s=sec%60;
      return h>0 ? `${h}:${pad(m)}:${pad(s)}` : `${m}:${pad(s)}`;
    };
    // タイトル簡略化
    function simplifyTitle(t) {
      return t.replace(/【.*?】|\[.*?\]/g, '').trim() || t;
    }

    // お気に入り取得・保存
    function getFavorites(){ return JSON.parse(localStorage.getItem(FAVORITES_KEY)||'[]'); }
    function saveFavorites(favs){ localStorage.setItem(FAVORITES_KEY, JSON.stringify(favs)); }

    // データ読み込み＆構築
    fetch('videos.json')
      .then(r=>r.json())
      .then(data => {
        // 正規化
        const map = new Map();
        data.forEach(v => {
          if(!v.youtubeId) return;
          if(!map.has(v.youtubeId)) map.set(v.youtubeId, {...v, songs:[], tags:v.tags||[]});
          const entry = map.get(v.youtubeId);
          // 曲情報
          (v.songs||v.setlist||[]).forEach(s => {
             entry.songs.push({
               title: s.title||s.song||'',
               artist: s.artist||s.singer||'',
               start: toSeconds(s.start||s.time||0)
             });
          });
          entry.songs.sort((a,b)=>a.start-b.start);
        });
        
        VIDEO_MAP = map;
        ALL_TAGS = Array.from(new Set(data.flatMap(v=>v.tags||[]))).sort();

        // 行リスト作成
        for(const v of VIDEO_MAP.values()){
          v.songs.forEach(s => {
             ALL_ROWS.push({
               id: v.youtubeId,
               videoTitle: v.title,
               date: v.date,
               song: s.title,
               artist: s.artist,
               start: s.start,
               tags: v.tags,
               tagsText: (v.tags||[]).join(' ')
             });
          });
        }
        // ソート（日付降順）
        ALL_ROWS.sort((a,b) => a.date < b.date ? 1 : -1);

        renderTags();
        applyFilter();
        
        // URLクエリ処理
        const p = new URLSearchParams(location.search);
        if(p.get('q')){
           $q.value = p.get('q');
           applyFilter();
        }
      })
      .catch(e => { $empty.textContent='読み込みエラー'; $empty.style.display='block'; });

    // 描画：タグ
    function renderTags(){
      $filterTags.innerHTML = '';
      ALL_TAGS.forEach(t => {
        const b = document.createElement('button');
        b.className = 'chip-tag' + (SELECTED_TAGS.has(t)?' active':'');
        b.textContent = t;
        b.onclick = () => {
          if(SELECTED_TAGS.has(t)) SELECTED_TAGS.delete(t); else SELECTED_TAGS.add(t);
          filterByFavorites = false;
          renderTags(); applyFilter();
        };
        $filterTags.appendChild(b);
      });
      $clearTags.style.display = (SELECTED_TAGS.size || filterByFavorites) ? 'block' : 'none';
      $filterFavorites.classList.toggle('active', filterByFavorites);
    }
    
    $filterFavorites.onclick = () => {
      filterByFavorites = !filterByFavorites;
      if(filterByFavorites) SELECTED_TAGS.clear();
      renderTags(); applyFilter();
    };
    $clearTags.onclick = () => {
      SELECTED_TAGS.clear(); filterByFavorites=false;
      renderTags(); applyFilter();
    };

    // 描画：リスト
    function applyFilter(){
      const q = $q.value.toLowerCase().trim();
      const favs = getFavorites();
      
      const hits = ALL_ROWS.filter(r => {
        if(filterByFavorites){
          return favs.includes(`${r.id}-${r.start}`);
        }
        if(SELECTED_TAGS.size > 0){
           if(!r.tags.some(t => SELECTED_TAGS.has(t))) return false;
        }
        if(!q) return true;
        return (r.song.toLowerCase().includes(q) || 
                r.artist.toLowerCase().includes(q) || 
                r.videoTitle.toLowerCase().includes(q) ||
                r.tagsText.toLowerCase().includes(q));
      });
      
      $list.innerHTML = '';
      if(!hits.length){ $empty.style.display='block'; return; }
      $empty.style.display='none';

      // 最初の100件のみ表示（軽量化）
      hits.slice(0, 100).forEach(r => {
        const div = document.createElement('div');
        div.className = 'row';
        const key = `${r.id}-${r.start}`;
        const isFav = favs.includes(key);

        div.innerHTML = `
          <div class="songcell">
            <div class="song-meta">
              <span style="font-size:18px">🎵</span>
              <button class="link song">${r.song}</button>
              <button class="favorite-btn ${isFav?'is-favorited':''}"><span class="star-icon">☆</span></button>
            </div>
            <div class="artist ellipsis"><button class="link artist">${r.artist}</button></div>
          </div>
          <div class="date">${ymdToDots(r.date)}</div>
          <div class="videotitle">
            <button type="button" class="vlink">${simplifyTitle(r.videoTitle)}</button>
            <div class="tags-row"></div>
          </div>
        `;
        
        // タグバッジ
        const tagBox = div.querySelector('.tags-row');
        if(r.tags && r.tags.length > 0){
           const b = document.createElement('span');
           b.className = 'tag-badge';
           b.textContent = r.tags[0]; // 最初の1つだけ
           tagBox.appendChild(b);
        }

        // イベント
        const playVideo = () => openPlayer(r.id, r.start);
        
        // 曲名・動画タイトルクリック -> 再生
        div.querySelector('.vlink').onclick = playVideo;
        div.addEventListener('click', (e) => {
           // ボタン以外をクリックでも再生
           if(!e.target.closest('button')) playVideo();
        });

        // 検索フィルイン
        div.querySelector('.song').onclick = (e) => { e.stopPropagation(); $q.value=r.song; applyFilter(); };
        div.querySelector('.artist').onclick = (e) => { e.stopPropagation(); $q.value=r.artist; applyFilter(); };

        // お気に入り
        div.querySelector('.favorite-btn').onclick = (e) => {
           e.stopPropagation();
           const nowFavs = getFavorites();
           const idx = nowFavs.indexOf(key);
           if(idx>=0) nowFavs.splice(idx,1); else nowFavs.push(key);
           saveFavorites(nowFavs);
           e.currentTarget.classList.toggle('is-favorited');
           if(filterByFavorites) applyFilter();
        };

        $list.appendChild(div);
      });
    }

    $q.addEventListener('input', applyFilter);

    /* ========== プレイヤー制御 ========== */
    let player;
    window.onYouTubeIframeAPIReady = () => {
       player = new YT.Player('ytFrame', {
         events: { 'onStateChange': onPlayerStateChange }
       });
    };
    function onPlayerStateChange(e){ /* 必要なら実装 */ }

    function openPlayer(vid, start){
       const v = VIDEO_MAP.get(vid);
       if(!v) return;

       // 1. メタ情報更新
       $pTitle.textContent = v.title;
       $pMeta.textContent = `${ymdToDots(v.date)} / ${v.channel||''}`;
       $openYT.href = `https://www.youtube.com/watch?v=${vid}&t=${start}s`;
       
       // 2. 再生
       const url = `https://www.youtube.com/embed/${vid}?start=${start}&autoplay=1&playsinline=1&enablejsapi=1&rel=0`;
       $yt.src = url;

       // 3. セットリスト描画
       $setlist.innerHTML = '';
       v.songs.forEach(s => {
          const row = document.createElement('div');
          row.className = 'set-item' + (s.start===start ? ' active' : '');
          row.innerHTML = `
            <div style="display:flex;justify-content:space-between;">
              <span style="font-weight:bold">${s.title}</span>
              <span>${hms(s.start)}</span>
            </div>
            <div style="font-size:11px;color:#666">${s.artist}</div>
          `;
          row.onclick = () => {
             // 同一動画内でシーク
             if(player && player.loadVideoById) {
                player.loadVideoById({videoId:vid, startSeconds:s.start});
             } else {
                $yt.src = `https://www.youtube.com/embed/${vid}?start=${s.start}&autoplay=1&playsinline=1&enablejsapi=1&rel=0`;
             }
             // アクティブ表示更新
             Array.from($setlist.children).forEach(c=>c.classList.remove('active'));
             row.classList.add('active');
          };
          $setlist.appendChild(row);
       });

       // 4. モバイル用モーダル表示制御
       if(window.innerWidth <= 900){
          document.body.classList.add('player-active');
       }
       // PCでは特に何もしなくてOK（stickyなので見える位置にある）
    }

    // 閉じるボタン（モバイル用）
    $closeBtn.onclick = () => {
       document.body.classList.remove('player-active');
       // 再生停止
       if(player && player.stopVideo) player.stopVideo();
       else $yt.src = 'about:blank';
    };

  </script>
</body>
</html>
